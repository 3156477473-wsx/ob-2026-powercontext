      id: 1810000000006-source-1810000000007-target
      source: '1810000000006'
      sourceHandle: source
      target: '1810000000007'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: 1810000000007-true-1810000000008-target
      source: '1810000000007'
      sourceHandle: 'true'
