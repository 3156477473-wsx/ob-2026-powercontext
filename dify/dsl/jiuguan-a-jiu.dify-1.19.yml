    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: 你的名字（用于区分不同客人的记忆）
          max_length: 32
          options: []
          required: true
          type: text-input
          variable: user_id
      height: 110
      id: '1810000000001'
      position:
        x: 40
        y: 300
      positionAbsolute:
        x: 40
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 取记忆与酒馆设定
        type: http-request
        authorization:
          config: null
          type: no-auth
        body:
          data: []
          type: none
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 200
        ssl_verify: true
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 30
        url: http://172.20.0.1:8791/api/recall?user_id={{#1810000000001.user_id#}}&message={{#sys.query#}}
        variables: []
      height: 140
      id: '1810000000002'
      position:
        x: 380
        y: 300
      positionAbsolute:
        x: 380
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 解析召回结果
        type: code
        code: "import json\n\n\ndef main(raw: str) -> dict:\n    data = {}\n    try:\n        data = json.loads(raw or \"{}\")\n    except Exception:\n        data = {}\n    memory_block = str(data.get(\"memory_block\") or \"（这位客人是第一次来，还没有任何记忆）\")\n    lore_block = str(data.get(\"lore_block\") or \"（今晚没有特别的酒单提示）\")\n    return {\n        \"memory_block\": memory_block,\n        \"lore_block\": lore_block,\n        \"memory_count\": str(data.get(\"memory_count\", 0)),\n        \"lore_count\": str(data.get(\"lore_count\", 0)),\n    }\n"
        code_language: python3
        outputs:
          memory_block:
            children: null
            type: string
          lore_block:
            children: null
            type: string
          memory_count:
            children: null
            type: string
          lore_count:
            children: null
            type: string
        variables:
        - value_selector:
          - '1810000000002'
          - body
          value_type: string
          variable: raw
      height: 140
      id: '1810000000003'
      position:
        x: 720
        y: 300
      positionAbsolute:
        x: 720
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 阿九调酒
        type: llm
        context:
          enabled: false
          variable_selector: []
        model: &id001
          provider: langgenius/openai_api_compatible/openai_api_compatible
          name: qwen2.5:7b
          mode: chat
          completion_params:
            max_tokens: 1024
            temperature: 0.7
            enable_thinking: false
        prompt_template:
        - id: p-barkeep-system
          role: system
          text: '你是「深夜酒馆」的酒保阿九。说话慢，话不多，语气像一张放过很多遍的旧唱片。


            每次回应请遵守：

            1. 先为客人调一杯酒，给它起一个 2~6 个字的名字（用《》括住），再写一句台词（不超过两行）。

            2. 【这位客人的记忆】里的事实必须用上，但不许编造记忆里没有的过去。记忆为空时，就当他是第一次来，不要假装早就认识。

            3. 可以自然引用【酒馆设定】里的店规、酒单或老梗，一次最多引用两条，不要整段背诵。

            4. 不要解释你在做什么，不要输出 JSON，不要堆砌表情符号。'
        - id: p-barkeep-user
          role: user
          text: '【这位客人的记忆】

            {{#1810000000003.memory_block#}}


            【酒馆设定】

            {{#1810000000003.lore_block#}}


            客人刚说：{{#sys.query#}}'
        variables: []
        vision:
          enabled: false
      height: 130
      id: '1810000000004'
      position:
        x: 1060
        y: 300
      positionAbsolute:
        x: 1060
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 抽取可记的事
        type: llm
        context:
          enabled: false
          variable_selector: []
        model: *id001
        prompt_template:
        - id: p-memory-system
          role: system
          text: '你负责从对话里抽取“值得记住的客人事实”，供酒保下次回忆。


            只输出一个 JSON 对象，不要输出任何其它文字：

            {"remember": "yes" 或 "no", "fact": "一句话，第三人称，最多 40 字"}


            判断规则：

            - 记录稳定的信息或重要经历：工作/学业状态、口味与忌口、情绪事件、约定、称呼、正在经历的难事。

            - 不记录：寒暄、点单动作、对酒的评价、酒保自己说的话。

            - 没有可记的内容时返回 {"remember": "no", "fact": ""}。'
        - id: p-memory-user
          role: user
          text: '客人说：{{#sys.query#}}

            阿九回应：{{#1810000000004.text#}}'
        variables: []
        vision:
          enabled: false
      height: 130
      id: '1810000000005'
      position:
        x: 1400
        y: 300
      positionAbsolute:
        x: 1400
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 解析记忆 JSON
        type: code
        code: "import json\nimport re\n\n\ndef main(raw: str) -> dict:\n    text = (raw or \"\").strip()\n    if text.startswith(\"```\"):\n        text = re.sub(r\"^```[a-zA-Z]*\\n?\", \"\", text)\n        text = re.sub(r\"\\n?```$\", \"\", text).strip()\n    match = re.search(r\"\\{[\\s\\S]*\\}\", text)\n    if match:\n        text = match.group(0)\n    remember, fact = \"no\", \"\"\n    try:\n        data = json.loads(text)\n        remember = \"yes\" if str(data.get(\"remember\", \"\")).strip().lower() in (\"yes\", \"true\", \"1\") else \"no\"\n        fact = str(data.get(\"fact\", \"\")).strip()[:120]\n    except Exception:\n        remember, fact = \"no\", \"\"\n    if not fact:\n        remember = \"no\"\n    return {\"should_remember\": remember, \"fact\": fact}\n"
        code_language: python3
        outputs:
          should_remember:
            children: null
            type: string
          fact:
            children: null
            type: string
        variables:
        - value_selector:
          - '1810000000005'
          - text
          value_type: string
          variable: raw
      height: 130
      id: '1810000000006'
      position:
        x: 1740
        y: 300
      positionAbsolute:
        x: 1740
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 要不要写入记忆
        type: if-else
        cases:
        - case_id: case-remember-yes
          conditions:
          - comparison_operator: is
            id: cond-should-remember
            value: 'yes'
            varType: string
            variable_selector:
            - '1810000000006'
            - should_remember
          id: case-remember-yes
          logical_operator: and
      height: 200
      id: '1810000000007'
      position:
        x: 2080
        y: 300
      positionAbsolute:
        x: 2080
        y: 300
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 写入 seekdb 记忆
        type: http-request
        authorization:
          config: null
          type: no-auth
        body:
          data: []
          type: none
        headers: 'Content-Type: application/json'
        method: get
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 200
        ssl_verify: true
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 30
          max_write_timeout: 30
        url: http://172.20.0.1:8791/api/remember?user_id={{#1810000000001.user_id#}}&fact={{#1810000000006.fact#}}
        variables: []
      height: 140
      id: '1810000000008'
      position:
        x: 2420
        y: 180
      positionAbsolute:
        x: 2420
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 回复（已记住）
        type: answer
        answer: '{{#1810000000004.text#}}'
        variables: []
      height: 110
      id: '1810000000009'
      position:
        x: 2760
        y: 180
      positionAbsolute:
        x: 2760
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        desc: ''
        selected: false
        title: 回复
        type: answer
        answer: '{{#1810000000004.text#}}'
        variables: []
      height: 110
      id: '1810000000010'
      position:
        x: 2760
        y: 420
      positionAbsolute:
        x: 2760
        y: 420
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.6
