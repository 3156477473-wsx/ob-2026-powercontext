        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
      id: 1810000000003-source-1810000000004-target
      source: '1810000000003'
      sourceHandle: source
      target: '1810000000004'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: llm
      id: 1810000000004-source-1810000000005-target
      source: '1810000000004'
      sourceHandle: source
      target: '1810000000005'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: 1810000000005-source-1810000000006-target
      source: '1810000000005'
      sourceHandle: source
      target: '1810000000006'
      targetHandle: target
