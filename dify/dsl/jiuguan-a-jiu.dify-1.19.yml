app:
  description: 深夜酒馆·阿九：用 Dify 编排、seekdb 存记忆的跨会话角色互动小游戏。
  icon: 🥃
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 深夜酒馆 · 阿九
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 500
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 100
        video_file_size_limit: 500
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: （门上的铜铃响了一下）阿九擦着杯子抬头：“外边冷吧？坐。今天想喝点什么，还是先说说今天怎么了？”
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 今天加班到十一点，老板还在群里发消息
    - 我又来了，老样子
    - 上周我是不是跟你说过一件很丢脸的事？
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: 1810000000001-source-1810000000002-target
      source: '1810000000001'
      sourceHandle: source
      target: '1810000000002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: 1810000000002-source-1810000000003-target
      source: '1810000000002'
